plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava

    // Implementation of the API contracts for the application.
    implementation files("${projectDir}/libs/apicontracts-1.0-SNAPSHOT.jar")  // Absolute path

    // Implementation of the JSON library for parsing and generating JSON.
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'ppfootballmanager.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// In app/build.gradle
sourceSets {
    main {
        resources {
            srcDirs = ["src/main/resources"]
        }
    }
}

// Add this to your build.gradle file
run {
    systemProperty 'gradle.running', 'true'
}